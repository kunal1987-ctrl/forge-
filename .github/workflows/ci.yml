name: FORGE CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_password
          POSTGRES_DB: forge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy Static Type Checker
        run: |
          mypy services/api --ignore-missing-imports

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://forge:forge_password@localhost:5432/forge_db
          REDIS_URL: redis://redis:6379
          OPENAI_API_KEY: mock-key-for-ci
        run: |
          pytest --ignore=venv
